openapi: 3.0.3
info:
  title: AvalAI Unified API
  description: |
    مستندات کامل و جامع API پلتفرم اول‌آی (AvalAI) - OpenAPI 3.0 Specification.
    AvalAI یک پلتفرم یکپارچه برای دسترسی به مدل‌های مختلف هوش مصنوعی (OpenAI, Anthropic, Google Gemini, Mistral, Cohere, FLUX, Sora و غیره) با پشتیبانی کامل از استاندارد OpenAI، مدل‌های بومی گوگل (v1beta)، OCR، جستجوی وب، رتبه‌بندی مجدد و مدیریت حساب کاربری است.
    
    آدرس پایه عمومی (Base URL): `https://api.avalai.ir/v1`
    آدرس پایه کاربری (User API Base URL): `https://api.avalai.ir/user/v1`
    آدرس پایه گوگل (Google GenAI Base URL): `https://api.avalai.ir/v1beta`
  version: 1.0.0
  contact:
    name: AvalAI Support
    url: https://avalai.ir/contact-us-avalai
servers:
  - url: https://api.avalai.ir/v1
    description: OpenAI-compatible API base URL (آدرس پایه استاندارد پلتفرم)
  - url: https://api.avalai.ir/user/v1
    description: AvalAI User & Billing API base URL (آدرس پایه سرویس کاربری و مالی)
  - url: https://api.avalai.ir/v1beta
    description: Google GenAI SDK v1beta base URL (آدرس پایه سرویس بومی گوگل)
  - url: https://api.avalai.ir
    description: Root Base URL
security:
  - BearerAuth: []

tags:
  - name: Models
    description: دریافت لیست مدل‌ها و اطلاعات آن‌ها (Models Management)
  - name: Chat Completions
    description: تولید پاسخ‌های متنی، مکالمه و ابزارها (Chat Completion Endpoint)
  - name: Responses
    description: سرویس ساختارمند و مدرن پاسخ‌دهی اول‌آی (Responses API)
  - name: Images
    description: ساخت، ویرایش و تولید واریانت تصویر (Images Generation & Edits)
  - name: Embeddings
    description: تولید بردارهای معنایی متن (Embeddings API)
  - name: Audio
    description: تبدیل گفتار به متن، ترجمه و متن به گفتار (Speech-to-Text & Text-to-Speech)
  - name: Moderation
    description: بررسی ایمنی محتوا و تعدیل (Content Moderation)
  - name: Rerank
    description: رتبه‌بندی مجدد مستندات بر اساس پرس‌وجو (Rerank API)
  - name: Search
    description: جستجوی مستقیم وب با استفاده از موتورهای جستجو (Web Search API)
  - name: OCR
    description: پردازش تصویر و استخراج ساختاریافته متن سند (Mistral OCR API)
  - name: Videos
    description: تولید و مدیریت ساخت ویدیو با مدل‌های Sora و Veo (Video Generation API)
  - name: Messages (Anthropic)
    description: رابط سازگار با Anthropic Claude Messages API
  - name: Google GenAI (v1beta)
    description: رابط بومی Google Gemini GenAI SDK
  - name: Vertex AI Text
    description: رابط سازگار با Vertex AI Synthesize Text
  - name: Files
    description: مدیریت فایل‌ها برای Fine-Tuning، Assistants و غیره (Files Management)
  - name: Batch
    description: پردازش دسته‌ای درخواست‌ها با تخفیف قیمت (Batch Processing API)
  - name: Fine-Tuning
    description: مدیریت فرآیند فین‌تیونینگ مدل‌ها (Fine-Tuning Jobs)
  - name: Assistants
    description: ساخت دستیارهای هوشمند، Threads، Messages و Runs (Assistants API)
  - name: User API
    description: استعلام اعتبار، تراکنش‌های مالی و خلاصه‌ی مصرف (User Account & Cost Tracking)

paths:
  # ---------------------------------------------------------------------------
  # Models API
  # ---------------------------------------------------------------------------
  /models:
    get:
      tags:
        - Models
      summary: دریافت لیست مدل‌های فعال (List Models)
      description: کل مدل‌های پشتیبانی شده توسط پلتفرم اول‌آی را بازیابی می‌کند.
      operationId: listModels
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /models/{model}:
    get:
      tags:
        - Models
      summary: دریافت جزئیات یک مدل (Retrieve Model)
      description: اطلاعات جزئی یک مدل مشخص را بازیابی می‌کند.
      operationId: retrieveModel
      parameters:
        - name: model
          in: path
          required: true
          description: شناسه‌ی مدل (مثلاً gpt-5.5 یا gemini-3.5-flash)
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelObject'
        '404':
          description: Model not found
        '401':
          $ref: '#/components/responses/401Unauthorized'

  # ---------------------------------------------------------------------------
  # Chat Completions API
  # ---------------------------------------------------------------------------
  /chat/completions:
    post:
      tags:
        - Chat Completions
      summary: ارسال درخواست چت و تکمیل متن (Create Chat Completion)
      description: تولید پاسخ برای مکالمات ورودی، فراخوانی ابزارها (Tools)، خروجی ساختاریافته، پردازش تصویر و متن.
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream when stream=true
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429RateLimit'

  # ---------------------------------------------------------------------------
  # Responses API
  # ---------------------------------------------------------------------------
  /responses:
    post:
      tags:
        - Responses
      summary: ایجاد پاسخ هوشمند ساختاریافته (Create Response)
      description: رابط جدید اول‌آی برای جریان‌های کاری مدرن متنی، چندوجهی و ابزارها.
      operationId: createResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /responses/{response_id}:
    get:
      tags:
        - Responses
      summary: دریافت جزئیات پاسخ ایجاد شده (Get Response)
      description: وضعیت و خروجی یک شناسه پاسخ ایجاد شده در سرویس Responses را بازیابی می‌کند.
      operationId: getResponse
      parameters:
        - name: response_id
          in: path
          required: true
          description: شناسه‌ی یکتای درخواست پاسخ
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
        '404':
          description: Response ID not found

  # ---------------------------------------------------------------------------
  # Images API
  # ---------------------------------------------------------------------------
  /images/generations:
    post:
      tags:
        - Images
      summary: ساخت تصویر با توصیف متنی (Create Image Generation)
      description: تولید تصاویر با استفاده از مدل‌های FLUX, DALL-E 3, GPT Image, Imagen و Nano Banana.
      operationId: createImageGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /images/edits:
    post:
      tags:
        - Images
      summary: ویرایش تصویر با ماسک یا دستور (Edit Image)
      description: ویرایش تصاویر موجود بر اساس پرامپت و تصویر ورودی (مانند مدل‌های Seedream یا DALL-E).
      operationId: createImageEdit
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageEditMultipartRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'

  /images/variations:
    post:
      tags:
        - Images
      summary: ایجاد واریانت از تصویر (Create Image Variation)
      description: تولید تصاویر مشابه بر اساس یک تصویر ورودی.
      operationId: createImageVariation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                model:
                  type: string
                n:
                  type: integer
                  default: 1
                size:
                  type: string
                  default: "1024x1024"
                response_format:
                  type: string
                  default: url
                user:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'

  # ---------------------------------------------------------------------------
  # Embeddings API
  # ---------------------------------------------------------------------------
  /embeddings:
    post:
      tags:
        - Embeddings
      summary: ایجاد بردارهای معنایی متن (Create Embeddings)
      description: محاسبه بردارهای امبدینگ برای جستجوی معنایی و سیستم‌های RAG.
      operationId: createEmbedding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  # ---------------------------------------------------------------------------
  # Audio API
  # ---------------------------------------------------------------------------
  /audio/transcriptions:
    post:
      tags:
        - Audio
      summary: تبدیل گفتار به متن (Create Audio Transcription)
      description: تبدیل فایل‌های صوتی به متن (Speech to Text) با مدل‌های Whisper.
      operationId: createAudioTranscription
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - model
              properties:
                file:
                  type: string
                  format: binary
                  description: فایل صوتی جهت پردازش (flac, mp3, mp4, m4a, ogg, wav, webm)
                model:
                  type: string
                  description: شناسه‌ی مدل (مثلاً whisper-1)
                language:
                  type: string
                  description: کد زبان ورودی (ISO-639-1)
                prompt:
                  type: string
                response_format:
                  type: string
                  enum: [json, text, srt, verbose_json, vtt]
                  default: json
                temperature:
                  type: number
                  default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTranscriptionResponse'

  /audio/translations:
    post:
      tags:
        - Audio
      summary: ترجمه صوتی به انگلیسی (Create Audio Translation)
      description: دریافت فایل صوتی به زبان‌های مختلف و ترجمه مستقیم آن به متن انگلیسی.
      operationId: createAudioTranslation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - model
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                prompt:
                  type: string
                response_format:
                  type: string
                  default: json
                temperature:
                  type: number
                  default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTranscriptionResponse'

  /audio/speech:
    post:
      tags:
        - Audio
      summary: تولید گفتار از متن (Create Audio Speech / TTS)
      description: تبدیل متن به فایل صوتی متناظر با صداهای مختلف.
      operationId: createAudioSpeech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioSpeechRequest'
      responses:
        '200':
          description: فایل صوتی تولید شده
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary

  # ---------------------------------------------------------------------------
  # Moderation API
  # ---------------------------------------------------------------------------
  /moderations:
    post:
      tags:
        - Moderation
      summary: ارزیابی ایمنی محتوا (Create Moderation)
      description: بررسی متن ورودی از نظر محتوای نامناسب یا ناقض قوانین.
      operationId: createModeration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationResponse'

  # ---------------------------------------------------------------------------
  # Rerank API
  # ---------------------------------------------------------------------------
  /rerank:
    post:
      tags:
        - Rerank
      summary: رتبه‌بندی مجدد مستندات (Rerank Documents)
      description: بازمرتب‌سازی نتایج جستجو یا سندها بر اساس میزان ارتباط آن‌ها با یک پرس‌وجو (Query).
      operationId: rerankDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'

  # ---------------------------------------------------------------------------
  # Search API
  # ---------------------------------------------------------------------------
  /search:
    post:
      tags:
        - Search
      summary: جستجوی مستقیم در وب (Web Search Query)
      description: اجرای استعلام جستجو در وب با موتورهای مختلف (Serper, Tavily, Perplexity, Exa, DataForSEO, Firecrawl).
      operationId: searchWeb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /search/{search_tool_name}:
    post:
      tags:
        - Search
      summary: جستجو با ابزار مشخص (Search with Specific Tool Path)
      description: اجرای استعلام با تعیین نام ابزار در مساوی URL (مانند /v1/search/serper-search).
      operationId: searchWebWithTool
      parameters:
        - name: search_tool_name
          in: path
          required: true
          description: نام ابزار جستجو (serper-search, tavily-search, perplexity-search و غیره)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  # ---------------------------------------------------------------------------
  # OCR API
  # ---------------------------------------------------------------------------
  /ocr:
    post:
      tags:
        - OCR
      summary: استخراج متن و ساختار اسناد (Mistral OCR)
      description: پردازش تصاویر و اسناد PDF جهت استخراج مارک‌داون، جداول، جعبه‌های احاطه‌کننده (Bounding Boxes) و عنوان‌ها.
      operationId: processOcr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrResponse'

  # ---------------------------------------------------------------------------
  # Videos API
  # ---------------------------------------------------------------------------
  /videos:
    post:
      tags:
        - Videos
      summary: ثبت درخواست تولید ویدیو (Create Video Generation)
      description: ارسال درخواست تولید ویدیو با مدل‌های Sora یا Veo به صورت غیرهمزمان (Async).
      operationId: createVideo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoGenerationRequest'
      responses:
        '200':
          description: Successful job submission response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationJob'

    get:
      tags:
        - Videos
      summary: دریافت لیست ویدیوهای کاربر (List Videos)
      description: بازیابی تمام کارهای تولید ویدیوی اکانت به همراه وضعیت آن‌ها.
      operationId: listVideos
      parameters:
        - name: safety_identifier
          in: query
          required: false
          schema:
            type: string
        - name: request_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'

  /videos/{video_id}:
    get:
      tags:
        - Videos
      summary: استعلام وضعیت و جزئیات ویدیو (Retrieve Video Status)
      description: دریافت اطلاعات و لینک خروجی ویدیوی ساخت شده با شناسه مشخص.
      operationId: retrieveVideo
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationJob'

    delete:
      tags:
        - Videos
      summary: حذف کار ساخت ویدیو (Delete Video)
      description: حذف یک ویدیو و محتوای وابسته به آن.
      operationId: deleteVideo
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean

  /videos/{video_id}/remix:
    post:
      tags:
        - Videos
      summary: بازتولید و ریمیکس ویدیو (Remix Video)
      description: ایجاد کار ویدیوی جدید بر اساس یک ویدیوی موجود و تنظیمات تغییریافته.
      operationId: remixVideo
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoGenerationRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenerationJob'

  /videos/{video_id}/content:
    get:
      tags:
        - Videos
      summary: دانلود فایل ویدیوی تولیدشده (Download Video Content)
      description: دریافت مستور فایل mp4 ویدیوی آماده شده.
      operationId: downloadVideoContent
      parameters:
        - name: video_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video MP4 file stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary

  # ---------------------------------------------------------------------------
  # Anthropic Messages API
  # ---------------------------------------------------------------------------
  /messages:
    post:
      tags:
        - Messages (Anthropic)
      summary: ارسال پیام بر اساس ساختار Anthropic Messages
      description: نقطه اتصال سازگار برای استفاده از SDKهای Anthropic Claude در اول‌آی.
      operationId: createAnthropicMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessageRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessageResponse'

  # ---------------------------------------------------------------------------
  # Files API
  # ---------------------------------------------------------------------------
  /files:
    post:
      tags:
        - Files
      summary: آپلود فایل (Upload File)
      description: آپلود اسناد و فایل‌ها برای استفاده در Fine-tuning، Assistants یا Search.
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - purpose
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  description: هدف فایل (fine-tune, assistants, batch)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'

    get:
      tags:
        - Files
      summary: دریافت لیست فایل‌ها (List Files)
      description: بازیابی تمام فایل‌های آپلود شده در حساب کاربری.
      operationId: listFiles
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileListResponse'

  /files/{file_id}:
    get:
      tags:
        - Files
      summary: دریافت مشخصات یک فایل (Retrieve File)
      description: متادیتای یک فایل را بازیابی می‌کند.
      operationId: retrieveFile
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
