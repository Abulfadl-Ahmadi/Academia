        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /transactions:
    get:
      tags:
        - User API
      summary: مشاهده تاریخچه تراکنش‌های مصرف (List Transactions)
      description: بازیابی لیست تراکنش‌های هزینه‌ای API با قابلیت فیلتر بر اساس مدل، سرویس‌دهنده و بازه زمانی (با ماندگاری حداقل ۹۰ روز).
      operationId: listTransactions
      servers:
        - url: https://api.avalai.ir/user/v1
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: provider
          in: query
          required: false
          schema:
            type: string
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /transactions/{request_id}:
    get:
      tags:
        - User API
      summary: پیگیری جزئیات هزینه‌ی یک درخواست (Retrieve Transaction by Request ID)
      description: استعلام دقیق محاسبه ریزهزینه و توکن‌های مصرف‌شده برای یک شناسه درخواست مشخص (Request ID).
      operationId: getTransactionByRequestId
      servers:
        - url: https://api.avalai.ir/user/v1
      parameters:
        - name: request_id
          in: path
          required: true
          description: شناسه‌ی یکتای درخواست API
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItem'
        '404':
          description: Transaction not found

  /usage/summary:
    get:
      tags:
        - User API
      summary: دریافت خلاصه آمار مصرف و هزینه (Get Usage Summary)
      description: دریافت گزارش تجمیعی مصرف و هزینه‌ها به تفکیک روز، مدل، سرویس‌دهنده یا کلید API.
      operationId: getUsageSummary
      servers:
        - url: https://api.avalai.ir/user/v1
      parameters:
        - name: group_by
          in: query
          required: false
          schema:
            type: string
            enum: [day, model, provider, api_key]
            default: day
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummaryResponse'

# ---------------------------------------------------------------------------
# Reusable Components & Schemas
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
      description: |
        احراز هویت استاندارد اول‌آی با ارسال کلید API در هدر Authorization.
        `Authorization: Bearer AVALAI_API_KEY`
    GoogleApiKeyHeader:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: |
        هدر اختصاصی کلید API برای درخواست‌های بومی Google GenAI SDK.
        `x-goog-api-key: AVALAI_API_KEY`

  responses:
    400BadRequest:
      description: درخواست نادرست به دلیل عدم تطابق الگوی پارامترها یا داده‌های ورودی
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: خطای عدم احراز هویت - کلید API ارسال نشده یا معتبر نیست
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    429RateLimit:
      description: خطای عبور از سقف مجاز نرخ درخواست‌ها (Rate Limit Exceeded)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Error Schemas
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: Invalid API key provided.
            type:
              type: string
              example: invalid_request_error
            param:
              type: string
              nullable: true
            code:
              type: string
              example: invalid_api_key

    # Models Schemas
    ModelObject:
      type: object
      required:
        - id
        - object
        - created
        - owned_by
      properties:
        id:
          type: string
          example: gpt-5.5
        object:
          type: string
          example: model
        created:
          type: integer
          example: 1710000000
        owned_by:
          type: string
          example: avalai

    ModelListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelObject'

    # Chat Completions Schemas
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: شناسه‌ی مدل مورد نظر جهت تولید پاسخ
          example: gpt-5.5
        messages:
          type: array
          description: آرایه شامل پیام‌های قبلی و جدید در مکالمه
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          default: 1
          minimum: 0
          maximum: 2
        top_p:
          type: number
          default: 1
        n:
          type: integer
          default: 1
        stream:
          type: boolean
          default: false
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        max_tokens:
          type: integer
        presence_penalty:
          type: number
          default: 0
        frequency_penalty:
          type: number
          default: 0
        user:
          type: string
        response_format:
          type: object
          properties:
            type:
              type: string
              enum: [text, json_object, json_schema]
            json_schema:
              type: object
        tools:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: function
              function:
                type: object
        tool_choice:
          oneOf:
            - type: string
            - type: object

    ChatMessage:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
        name:
          type: string
        tool_calls:
          type: array
          items:
            type: object
        tool_call_id:
          type: string

    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          example: chatcmpl-12345
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
                example: stop
        usage:
          $ref: '#/components/schemas/UsageInfo'

    UsageInfo:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    # Responses Schemas
    ResponsesRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          example: gpt-5.6-sol
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
        instructions:
          type: string
        tools:
          type: array
          items:
            type: object
        output_format:
          type: object

    ResponsesResponse:
      type: object
      properties:
        id:
          type: string
          example: resp-98765
        object:
          type: string
          example: response
        created:
          type: integer
        model:
          type: string
        output_text:
          type: string
        status:
          type: string
        usage:
          $ref: '#/components/schemas/UsageInfo'

    # Image Schemas
    ImageGenerationRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          example: A realistic photo of Mount Damavand during sunset
        model:
          type: string
          default: flux-schnell
        n:
          type: integer
          default: 1
        quality:
          type: string
          default: standard
        response_format:
          type: string
          enum: [url, b64_json]
          default: url
        size:
          type: string
          default: 1024x1024
        style:
          type: string

    ImageEditMultipartRequest:
      type: object
      required:
        - image
        - prompt
      properties:
        image:
          type: string
          format: binary
        prompt:
          type: string
        mask:
          type: string
          format: binary
        model:
          type: string
        n:
          type: integer
        size:
          type: string
        response_format:
          type: string

    ImageResponse:
      type: object
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              b64_json:
                type: string
              revised_prompt:
                type: string

    # Embeddings Schemas
    EmbeddingsRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          example: text-embedding-3-small
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        user:
          type: string
        dimensions:
          type: integer

    EmbeddingsResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
                example: embedding
              embedding:
                type: array
                items:
                  type: number
              index:
                type: integer
        model:
          type: string
        usage:
          $ref: '#/components/schemas/UsageInfo'

    # Speech/Audio Schemas
    AudioTranscriptionResponse:
      type: object
      properties:
        text:
          type: string
        task:
          type: string
        language:
          type: string
        duration:
          type: number
        segments:
          type: array
          items:
            type: object

    AudioSpeechRequest:
      type: object
      required:
        - model
        - input
        - voice
      properties:
        model:
          type: string
          example: tts-1
        input:
          type: string
          example: سلام! به اول‌آی خوش آمدید.
        voice:
          type: string
          example: alloy
        response_format:
          type: string
          enum: [mp3, opus, aac, flac, wav]
          default: mp3
        speed:
          type: number
          default: 1.0

    # Moderation Schemas
    ModerationRequest:
      type: object
      required:
        - input
      properties:
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        model:
          type: string

    ModerationResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              flagged:
                type: boolean
              categories:
                type: object
              category_scores:
                type: object

    # Rerank Schemas
    RerankRequest:
      type: object
      required:
        - model
        - query
        - documents
      properties:
        model:
          type: string
          example: cohere-rerank-v4.0-pro
        query:
          type: string
          example: هوش مصنوعی چیست؟
        documents:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  id:
                    type: string
                  text:
                    type: string
        top_n:
          type: integer
        return_documents:
          type: boolean
          default: true
        user:
          type: string

    RerankResponse:
      type: object
      properties:
        id:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              relevance_score:
                type: number
              document:
                type: object

    # Search Schemas
    SearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: آخرین اخبار فناوری در ایران
        search_tool_name:
          type: string
          example: serper-search
        max_results:
          type: integer
          default: 10
        search_domain_filter:
          type: array
          items:
            type: string
        max_tokens_per_page:
          type: integer
          default: 1024
        country:
          type: string

    SearchResponse:
      type: object
      properties:
        query:
          type: string
        search_tool_name:
          type: string
        results:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
              snippet:
                type: string

    # OCR Schemas
    OcrRequest:
      type: object
      required:
        - model
        - document
      properties:
        model:
          type: string
          example: mistral-ocr-4-0
        document:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum: [document_url, image_url]
            document_url:
              type: string
            image_url:
              type: string
        pages:
          type: array
          items:
            type: integer
        include_image_base64:
          type: boolean
          default: false
        extract_header:
          type: boolean
          default: false
        extract_footer:
          type: boolean
          default: false
        table_format:
          type: string
          enum: [markdown, html]
          default: markdown

    OcrResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        pages:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              markdown:
                type: string
              images:
                type: array
                items:
                  type: object

    # Video Schemas
    VideoGenerationRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          example: A cinematic drone shot over Persepolis at sunset
        model:
          type: string
          example: sora-1.0
        duration:
          type: integer
          default: 5
        aspect_ratio:
          type: string
          default: "16:9"
        resolution:
          type: string
          default: "720p"

    VideoGenerationJob:
      type: object
      properties:
        id:
          type: string
          example: vid-554433
        object:
          type: string
          example: video.job
        created_at:
          type: integer
        status:
          type: string
          enum: [queued, processing, completed, failed]
        model:
          type: string
        video_url:
          type: string

    VideoListResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/VideoGenerationJob'

    # Anthropic Messages Schemas
    AnthropicMessageRequest:
      type: object
      required:
        - model
        - messages
        - max_tokens
      properties:
        model:
          type: string
          example: claude-3-5-sonnet
        messages:
          type: array
          items:
            type: object
        system:
          type: string
        max_tokens:
          type: integer
        temperature:
          type: number
        stream:
          type: boolean

    AnthropicMessageResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          example: message
        role:
          type: string
          example: assistant
        content:
          type: array
          items:
            type: object
        model:
          type: string

    # Files Schemas
    FileObject:
      type: object
      properties:
        id:
          type: string
          example: file-abc1234
        object:
          type: string
          example: file
        bytes:
          type: integer
        created_at:
          type: integer
        filename:
          type: string
        purpose:
          type: string

    FileListResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileObject'

    # Batch Schemas
    BatchRequest:
      type: object
      required:
        - input_file_id
        - endpoint
        - completion_window
      properties:
        input_file_id:
          type: string
        endpoint:
          type: string
          example: /v1/chat/completions
        completion_window:
          type: string
          example: 24h
        metadata:
          type: object

    BatchJob:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: batch
        endpoint:
          type: string
        input_file_id:
          type: string
        completion_window:
          type: string
        status:
          type: string
          example: completed
        output_file_id:
          type: string
        error_file_id:
          type: string
        created_at:
          type: integer

    # Fine-Tuning Schemas
    FineTuningJob:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: fine_tuning.job
        created_at:
          type: integer
        model:
          type: string
        training_file:
          type: string
        status:
          type: string

    # Assistants Schemas
    AssistantObject:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: assistant
        created_at:
          type: integer
        name:
          type: string
        description:
          type: string
        model:
          type: string
        instructions:
          type: string

    ThreadObject:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: thread
        created_at:
          type: integer

    ThreadMessageObject:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: thread.message
        created_at:
          type: integer
        thread_id:
          type: string
        role:
          type: string
        content:
          type: array
          items:
            type: object

    RunObject:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: thread.run
        created_at:
          type: integer
        thread_id:
          type: string
        assistant_id:
          type: string
        status:
          type: string

    # Google GenAI Schemas
    GoogleGenerateContentRequest:
      type: object
      required:
        - contents
      properties:
        contents:
          type: array
          items:
            type: object
            required:
              - parts
              - role
            properties:
              role:
                type: string
                enum: [user, model]
              parts:
                type: array
                items:
                  type: object
        system_instruction:
          type: object
          properties:
            parts:
              type: array
              items:
                type: object
        generationConfig:
          type: object
          properties:
            temperature:
              type: number
            topP:
              type: number
            topK:
              type: integer
            maxOutputTokens:
              type: integer
            responseMimeType:
              type: string

    GoogleGenerateContentResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            type: object
            properties:
              content:
                type: object
              finishReason:
                type: string
        usageMetadata:
          type: object

    # User API Schemas
    CreditResponse:
      type: object
      required:
        - remaining_irt
        - account_tier
      properties:
        limit:
          type: number
          description: سقف اعتبار حساب (تومان)
          example: 10000000
        remaining_irt:
          type: number
          description: اعتبار باقیمانده حساب به تومان (IRT)
          example: 4500000
        account_tier:
          type: integer
          description: سطح حساب کاربری (از Tier 0 تا Tier 5)
          example: 2

    TransactionItem:
      type: object
      properties:
        id:
          type: string
          example: tx-112233
        request_id:
          type: string
          example: req-998877
        model:
          type: string
          example: gpt-5.5
        provider:
          type: string
          example: openai
        cost_irt:
          type: number
          example: 120.5
        prompt_tokens:
          type: integer
          example: 150
        completion_tokens:
          type: integer
          example: 45
        created_at:
          type: string
          format: date-time

    TransactionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    UsageSummaryResponse:
      type: object
      properties:
        summary:
          type: array
          items:
            type: object
            properties:
              group:
                type: string
                example: 2026-08-06
              total_cost_irt:
                type: number
              total_requests:
                type: integer
              total_prompt_tokens:
                type: integer
              total_completion_tokens:
                type: integer
