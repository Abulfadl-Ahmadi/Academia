name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows triggering the build manually from GitHub UI

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create .env file
        working-directory: ./vite-project
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env
          # اگر متغیرهای دیگه‌ای هم دارید در خطوط بعدی اضافه کنید

      - name: Install dependencies and build web
        working-directory: ./vite-project
        run: |
          npm install
          npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync Capacitor Android project
        working-directory: ./vite-project
        run: |
          npx cap sync android

      - name: Build Android APK
        working-directory: ./vite-project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: vite-project/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ github.run_number }}
          name: Android APK Build #${{ github.run_number }}
          files: vite-project/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
